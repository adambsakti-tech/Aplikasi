<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canton Daily</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
    body { background:#0f0f1a; color:#e0e0f0; font-size:14px; padding-bottom:70px; }
    .header { background:#1a1a2e; padding:14px 16px; border-bottom:1px solid #2a2a4a; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
    .header h1 { font-size:16px; color:#7c7cf0; }
    .header .v { font-size:10px; color:#606080; }
    .header-actions { display:flex; gap:6px; }
    .header-actions button { border:1px solid #3a3a5a; background:none; color:#a0a0d0; padding:7px 10px; border-radius:6px; font-size:13px; }
    .scan { background:#7c7cf0 !important; color:#fff !important; border-color:#7c7cf0 !important; }
    .scan:disabled { opacity:.6; }
    .day-bar { padding:8px 16px; background:#14142a; font-size:11px; color:#9090c0; border-bottom:1px solid #2a2a4a; }
    .pane { padding:10px 16px; }
    .muted { color:#8080a0; font-size:12px; padding:8px 0; }
    /* harian */
    .grp { margin-bottom:12px; }
    .gh { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid #2a2a4a; }
    .gh b { flex:1; color:#b0b0e0; font-size:13px; }
    .gh .gt { font-size:11px; color:#e0a060; }
    .gh .bd { background:#2a2a4a; color:#a0a0d0; padding:2px 8px; border-radius:10px; font-size:11px; }
    .wi { display:flex; justify-content:space-between; align-items:flex-start; padding:8px; background:#16162a; border-radius:6px; margin:4px 0; }
    .wi .nm { font-weight:500; color:#d0d0f0; }
    .wi .td { display:flex; flex-direction:column; align-items:flex-end; gap:2px; font-size:12px; color:#8080a0; }
    .wi .td .sp { color:#e08080; }
    .wi .td .fee { font-size:11px; color:#e0a060; }
    .wi .td .pool { font-size:11px; color:#60c0a0; }
    .wi .td .bal { font-size:11px; color:#80a0c0; }
    .wi .td .err { color:#e06060; }
    /* range */
    .rrow { display:flex; gap:8px; align-items:center; margin:8px 0; flex-wrap:wrap; }
    .rrow input[type=date] { flex:1; background:#0f0f1a; border:1px solid #3a3a5a; color:#e0e0f0; padding:9px; border-radius:6px; font-size:13px; }
    .rrow button, .formrow button { background:#7c7cf0; color:#fff; border:none; padding:9px 16px; border-radius:6px; font-size:13px; }
    table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    th,td { text-align:right; padding:6px; border-bottom:1px solid #1f1f3a; }
    th:first-child, td:first-child { text-align:left; }
    th { color:#9090c0; font-weight:500; }
    tr.grp td { color:#d0a060; font-weight:600; background:#16162a; }
    tr.tot td { color:#e0a060; font-weight:700; border-top:1px solid #3a3a5a; }
    .feec { color:#e0a060; } .balc { color:#80c0a0; } .err { color:#e06060; }
    /* wallet admin */
    .adm-grp { margin-bottom:14px; }
    .adm-h { display:flex; align-items:center; gap:8px; padding-bottom:6px; border-bottom:1px solid #2a2a4a; }
    .adm-h b { flex:1; color:#d0d0f0; }
    .adm-h .bd { background:#2a2a4a; color:#a0a0d0; padding:1px 7px; border-radius:8px; font-size:11px; }
    .adm-h .delg { background:#3a2a2a; color:#e08080; border:none; padding:5px 9px; border-radius:6px; font-size:11px; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
    .tag { background:#2a2a4a; border:1px solid #3a3a5a; border-radius:6px; padding:5px 9px; font-size:12px; display:flex; align-items:center; gap:6px; }
    .tag b.rm { color:#e06060; cursor:pointer; font-weight:bold; }
    .formrow { display:flex; flex-direction:column; gap:8px; margin:10px 0; padding:12px; background:#16162a; border-radius:8px; }
    .formrow input, .formrow select { background:#0f0f1a; border:1px solid #3a3a5a; color:#e0e0f0; padding:9px; border-radius:6px; font-size:13px; }
    .formrow h3 { font-size:13px; color:#b0b0e0; }
    .danger { background:#e04040 !important; }
    /* notifikasi */
    .notif-section { margin-bottom:16px; }
    .notif-controls { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
    .notif-controls button { background:#7c7cf0; color:#fff; border:none; padding:9px 14px; border-radius:6px; font-size:12px; flex:1; min-width:100px; }
    .notif-controls button.sec { background:#2a2a4a; }
    .notif-controls button.start { background:#2a8a2a; }
    .notif-controls button.stop { background:#8a2a2a; }
    .monitored-wallet { display:flex; align-items:center; gap:8px; padding:8px; background:#16162a; border-radius:6px; margin:4px 0; border-left:3px solid #7c7cf0; }
    .monitored-wallet.disabled { border-left-color:#606080; opacity:0.7; }
    .mw-label { flex:1; font-weight:500; color:#d0d0f0; }
    .mw-status { font-size:11px; color:#8080a0; background:#2a2a4a; padding:2px 8px; border-radius:4px; }
    .mw-toggle { background:#5a5ac0; color:#fff; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; }
    .mw-remove { background:#3a2a2a; color:#e08080; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer; }
    .notif-item { background:#16162a; border-left:2px solid #60c0a0; padding:8px; margin:6px 0; border-radius:4px; font-size:11px; }
    .notif-time { color:#8080a0; font-size:10px; }
    .notif-title { color:#d0d0f0; margin:2px 0; }
    .notif-msg { color:#a0a0c0; font-size:10px; margin:2px 0; }
    .stats-badge { display:inline-block; background:#2a2a4a; color:#a0a0d0; padding:4px 8px; border-radius:6px; font-size:11px; margin:2px; }
    /* tabs */
    .tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#1a1a2e; border-top:1px solid #2a2a4a; overflow-x:auto; }
    .tabs button { flex:1; background:none; border:none; color:#8080a0; padding:14px 0; font-size:12px; white-space:nowrap; }
    .tabs button.active { color:#7c7cf0; border-top:2px solid #7c7cf0; }
    .status-bar { padding:9px 16px; background:#12122a; font-size:11px; color:#8080a0; text-align:center; }
    /* modal */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:50; align-items:center; justify-content:center; padding:16px; }
    .modal .box { background:#16162a; border-radius:10px; width:100%; max-width:560px; padding:14px; max-height:80vh; overflow-y:auto; }
    .modal textarea { width:100%; height:50vh; background:#0f0f1a; color:#d0d0e0; border:1px solid #3a3a5a; border-radius:6px; padding:8px; font-family:monospace; font-size:11px; }
    .modal .mrow { display:flex; gap:8px; margin-top:10px; }
    .modal .mrow button { flex:1; background:#7c7cf0; color:#fff; border:none; padding:10px; border-radius:6px; font-size:13px; }
    .modal .mrow button.sec { background:#2a2a4a; }
    @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>🏦 Canton Daily <span class="v">v2.0</span></h1>
    <div class="header-actions">
      <button id="exportBtn">📄</button>
      <button id="scanBtn" class="scan">▶ Scan</button>
    </div>
  </div>
  <div id="dayBar" class="day-bar">Hari ini (UTC): —</div>

  <!-- TAB: HARIAN -->
  <div id="tab-harian" class="pane"><div id="harianGroups"></div></div>

  <!-- TAB: RANGE -->
  <div id="tab-range" class="pane" style="display:none">
    <p class="muted">Fee → orderbook-fee, pilih rentang (UTC, maks 30 hari). Saldo = saat ini.</p>
    <div class="rrow">
      <input type="date" id="rStart"><span>→</span><input type="date" id="rEnd">
      <button id="rBtn">Hitung</button>
    </div>
    <div id="rangeResult"></div>
  </div>

  <!-- TAB: NOTIFIKASI -->
  <div id="tab-notifikasi" class="pane" style="display:none">
    <div class="notif-section">
      <h3 style="margin-bottom:8px; color:#b0b0e0;">📢 Kontrol Notifikasi</h3>
      <div class="notif-controls">
        <button id="reqPermBtn" class="sec">Minta Izin</button>
        <button id="startMonitorBtn" class="start">▶ Mulai Pantau</button>
        <button id="stopMonitorBtn" class="stop">⏹ Berhenti</button>
      </div>
      <div id="notifStats" style="padding:8px; background:#16162a; border-radius:6px; font-size:11px; color:#8080a0;"></div>
    </div>

    <div class="notif-section">
      <h3 style="margin-bottom:8px; color:#b0b0e0;">👁️ Wallet Dipantau</h3>
      <div id="monitoredWalletsContainer"></div>
    </div>

    <div class="formrow">
      <h3>➕ Tambah Wallet ke Pantauan</h3>
      <select id="addMonitorSelect">
        <option value="">Pilih wallet dari daftar...</option>
      </select>
      <button id="addMonitorBtn">Tambah ke Pantauan</button>
    </div>

    <div class="notif-section">
      <h3 style="margin-bottom:8px; color:#b0b0e0;">📋 Riwayat Notifikasi</h3>
      <div id="notificationHistoryContainer"></div>
    </div>
  </div>

  <!-- TAB: WALLET -->
  <div id="tab-wallet" class="pane" style="display:none">
    <div id="walletAdmin"></div>
    <div class="formrow">
      <h3>➕ Tambah Wallet</h3>
      <select id="wGroup"></select>
      <input id="wLabel" placeholder="Label (mis. adi)">
      <input id="wPid" placeholder="Party ID (supa1::...)">
      <button id="addWalletBtn">Tambah Wallet</button>
    </div>
    <div class="formrow">
      <h3>📂 Tambah Grup</h3>
      <input id="wNewGroup" placeholder="Nama grup">
      <button id="addGroupBtn">Tambah Grup</button>
    </div>
    <div class="formrow">
      <button id="resetBtn" class="danger">↺ Reset ke Default</button>
    </div>
  </div>

  <div class="status-bar"><span id="statusText">Klik Scan untuk hitung transaksi hari ini.</span></div>

  <div class="tabs">
    <button id="btn-harian" class="active">Harian</button>
    <button id="btn-range">Range</button>
    <button id="btn-notifikasi">🔔 Notif</button>
    <button id="btn-wallet">Wallet</button>
  </div>

  <div id="exportModal" class="modal">
    <div class="box">
      <textarea id="exportText" readonly></textarea>
      <div class="mrow">
        <button id="copyExportBtn">Salin</button>
        <button id="dlExportBtn">Download</button>
        <button id="closeModalBtn" class="sec">Tutup</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script src="wallet-notifications.js"></script>
</body>
</html>
